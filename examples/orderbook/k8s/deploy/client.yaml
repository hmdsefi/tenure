# Two load clients of the orderbook. Each embeds a tenure.Router on a watch-only Adapter and
# sends every order straight to its owner: no Service in front of them, no proxy behind them.
# Their read-only ServiceAccount may only get, list and watch Leases.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: client
  labels:
    app: client
spec:
  replicas: 2
  selector:
    matchLabels:
      app: client
  template:
    metadata:
      labels:
        app: client
    spec:
      serviceAccountName: tenure-readonly
      # The in-flight orders take up to 20 s, then the final stats stay served for 10 s.
      terminationGracePeriodSeconds: 45
      containers:
        - name: client
          image: tenure-orderbook-client:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: RATE
              value: "40"
            - name: FALLBACK_URL
              value: http://orderbook:8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
