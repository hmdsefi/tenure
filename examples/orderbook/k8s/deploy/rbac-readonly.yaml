# A copy of the k8s module's rbac-readonly.yaml without its namespace, which kustomize sets:
# kustomize cannot load a file outside its directory. The client pods follow the group with a
# watch-only Adapter and need only get, list and watch on Leases. TestReadOnlyRBACCopy in
# orderbook/k8s/client checks that the Role's rules stay the original's.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: tenure-readonly
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch"]
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tenure-readonly
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: tenure-readonly
subjects:
  - kind: ServiceAccount
    name: tenure-readonly
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: tenure-readonly
