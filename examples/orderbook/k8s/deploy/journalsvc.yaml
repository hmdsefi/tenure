# The journal and its fences, in memory: one replica, because the fence must be one.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: journalsvc
  labels:
    app: journalsvc
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: journalsvc
  template:
    metadata:
      labels:
        app: journalsvc
    spec:
      automountServiceAccountToken: false
      containers:
        - name: journalsvc
          image: tenure-journalsvc:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: LISTEN_ADDR
              value: ":8080"
          readinessProbe:
            httpGet:
              path: /entries?shard=0
              port: http
            periodSeconds: 2
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
---
apiVersion: v1
kind: Service
metadata:
  name: journalsvc
spec:
  selector:
    app: journalsvc
  ports:
    - name: http
      port: 8080
      targetPort: http
