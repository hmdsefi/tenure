# The orderbook pods keep the group "orderbook" in Leases of their own namespace and need
# nothing else.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: orderbook
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "delete"]
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: orderbook
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: orderbook
subjects:
  - kind: ServiceAccount
    name: orderbook
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: orderbook
