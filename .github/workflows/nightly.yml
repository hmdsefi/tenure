name: nightly

on:
  schedule:
    - cron: '17 3 * * *' # 03:17 UTC, every day
  workflow_dispatch:

permissions:
  contents: read

env:
  GOTOOLCHAIN: local

jobs:
  simtest:
    name: simtest (2000 explored seeds)
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      GOWORK: 'off'
      FAULTLINE_SEEDS: '2000'
      FAULTLINE_EXPLORE: '1'
    steps:
      - name: seed settings
        run: echo "FAULTLINE_SEEDS=$FAULTLINE_SEEDS FAULTLINE_EXPLORE=$FAULTLINE_EXPLORE"
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: simtest/go.mod
          cache-dependency-path: simtest/go.sum
      # No simtest test checks determinism by itself, so the variable is what runs every passing
      # seed twice here. The goroutine-mode tests of bubble skip under it, so they get a step of
      # their own, without it.
      - name: simulations with new seeds, every seed twice
        env:
          FAULTLINE_ARTIFACTS: ${{ runner.temp }}/faultline
          FAULTLINE_CHECK_DETERMINISM: '1'
        run: go -C simtest test -count=1 -timeout 350m ./...
      - name: goroutine mode with new seeds
        if: ${{ !cancelled() }}
        env:
          FAULTLINE_ARTIFACTS: ${{ runner.temp }}/faultline
        run: go -C simtest test -count=1 -timeout 30m ./bubble/...
      - name: upload the artifacts of the failing seeds
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: faultline-nightly
          path: ${{ runner.temp }}/faultline
