name: codeql

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '27 4 * * 1'

permissions:
  contents: read

env:
  GOTOOLCHAIN: local
  GOWORK: 'off'

jobs:
  analyze:
    name: CodeQL (go)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: github/codeql-action/init@v4
        with:
          languages: go
          build-mode: manual
      - name: build
        run: go build ./...
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:go
