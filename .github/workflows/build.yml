name: build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  GOTOOLCHAIN: local

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    env:
      GOWORK: 'off'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
      - name: golangci-lint (k8s)
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
          working-directory: k8s
      - name: golangci-lint (examples)
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
          working-directory: examples
      - name: golangci-lint (simtest)
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
          working-directory: simtest
      - name: golangci-lint (simtest, tenure_mutants)
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
          working-directory: simtest
          args: --build-tags tenure_mutants

  build:
    name: Go build
    runs-on: ubuntu-latest
    env:
      GOWORK: 'off'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable # the test job covers the minimum version in go.mod
      - name: gofmt
        run: |
          out=$(gofmt -l $(git ls-files '*.go'))
          if [ -n "$out" ]; then
            echo "these files are not gofmt-formatted:"
            echo "$out"
            exit 1
          fi
      - name: go mod tidy
        run: go mod tidy -diff
      - name: vet
        run: go vet ./...
      - name: build
        run: go build -v ./...
      - name: private files are not committed
        run: |
          files=$( { git ls-files | grep -E '^(\.helper/|AGENTS\.md$)|(^|/)go\.work(\.sum)?$|^\.[^/]+' | grep -vE '^(\.github/|\.gitignore$|\.golangci\.yml$|\.testcoverage\.yml$)'; git ls-files | grep -E '^[^/]+\.md$' | grep -vx 'README.md'; } || true)
          if [ -n "$files" ]; then
            echo "these files are private and must not be committed:"
            echo "$files"
            exit 1
          fi

  test:
    name: Go test (go ${{ matrix.go }})
    strategy:
      fail-fast: false
      matrix:
        go: ['1.26.x', 'stable']
    runs-on: ubuntu-latest
    env:
      GOWORK: 'off'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
      - name: test
        run: go test -race -count=1 ./...

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    env:
      GOWORK: 'off'
    outputs:
      total: ${{ steps.coverage.outputs.total-coverage }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: test with coverage
        run: go test -race -count=1 -covermode=atomic -coverprofile=cover.out ./...
      - name: check coverage
        id: coverage
        uses: vladopajic/go-test-coverage@249eda999ac7e91238727277beec9b32b28a19b0 # v2.21.0
        with:
          config: ./.testcoverage.yml
      - name: coverage summary
        if: ${{ !cancelled() && steps.coverage.outputs.report != '' }}
        env:
          REPORT: ${{ fromJSON(steps.coverage.outputs.report) }}
        run: |
          {
            echo '```'
            echo "$REPORT"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  coverage-badge:
    name: coverage badge
    needs: coverage
    if: github.event_name == 'push' && github.ref_name == 'main'
    runs-on: ubuntu-latest
    permissions:
      issues: write # the README coverage badge shows the title of issue #235
    steps:
      - name: update the coverage badge
        env:
          GH_TOKEN: ${{ github.token }}
          COVERAGE: ${{ needs.coverage.outputs.total }}
        run: |
          test -n "$COVERAGE"
          title="$COVERAGE%"
          current=$(gh issue view 235 --repo "$GITHUB_REPOSITORY" --json title --jq .title)
          if [ "$current" != "$title" ]; then
            gh issue edit 235 --repo "$GITHUB_REPOSITORY" --title "$title"
          fi

  determinism:
    name: determinism (${{ matrix.os }}, go ${{ matrix.go }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        go: ['1.26.x', 'stable']
    runs-on: ${{ matrix.os }}
    env:
      GOWORK: 'off'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
      - name: core import allow-list, determinism rules, golden digests
        run: go test -count=1 ./internal/dettest/... ./core/...
      - name: core on 32-bit (linux/386)
        if: matrix.os == 'ubuntu-latest'
        env:
          GOARCH: '386'
        run: |
          go test -count=1 ./core/...
          go test -count=1 -run '^TestCoreDigests$' ./internal/dettest
      - name: 'simulation: every seed twice, equal trace hashes'
        env:
          FAULTLINE_CHECK_DETERMINISM: '1'
        run: go -C simtest test -count=1 -skip '^TestGoldenHashes$' ./...
      # Its own step with -v, so the log shows it passing under go 1.26 and skipping under
      # other minor versions, where its hashes are not pinned.
      - name: 'simulation: golden trace hashes'
        env:
          FAULTLINE_CHECK_DETERMINISM: '1'
        run: go -C simtest test -count=1 -run '^TestGoldenHashes$' -v .

  api:
    name: API snapshot
    runs-on: ubuntu-latest
    env:
      GOWORK: 'off'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.0' # go doc output is pinned to the go line of go.mod
      - name: api/tenure.txt and api/core.txt match go doc -all
        run: |
          go doc -all github.com/hmdsefi/tenure > api/tenure.txt
          go doc -all github.com/hmdsefi/tenure/core > api/core.txt
          git diff --exit-code -- api/
      - name: public docs cite no spec IDs
        run: |
          set -e
          out="$RUNNER_TEMP/docs.txt"
          : > "$out"
          for p in $(go list ./... | grep -v -E '/internal(/|$)'); do go doc -all "$p" >> "$out"; done
          for mod in $(git ls-files '*/go.mod' | xargs -r -n 1 dirname | sort); do
            for p in $(go -C "$mod" list ./... | grep -v -E '/internal(/|$)'); do go -C "$mod" doc -all "$p" >> "$out"; done
          done
          if grep -nwE '(AT-)?(REP|DET|COR|ASG|MCH|PTR|RUN|STO|MEM|K8S|OBS|SIM|EXM|PGS|ETC|GSP|RCP|TMP|BEN|WLD|SPL|CLI|MET)-[0-9]{2,3}' "$out"; then
            echo "public doc comments cite spec IDs; the specs are private, so describe the behavior instead"
            exit 1
          fi

  nested:
    name: nested modules (go ${{ matrix.go }})
    strategy:
      fail-fast: false
      matrix:
        go: ['1.26.x', 'stable']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
      - name: workspace with the root and all nested modules
        run: |
          go work init
          go work use -r .
      - name: tidy, vet and test each nested module
        run: |
          set -e
          for mod in $(git ls-files '*/go.mod' | xargs -r -n 1 dirname | sort); do
            echo "::group::$mod"
            if [ "$mod" != cmd/tenure ]; then
              GOWORK=off go -C "$mod" mod tidy -diff
            fi
            go -C "$mod" vet ./...
            if [ "$mod" != simtest ]; then
              go -C "$mod" test -race -count=1 ./...
            fi
            echo "::endgroup::"
          done

  simtest-short:
    name: simtest (-short)
    runs-on: ubuntu-latest
    env:
      GOWORK: 'off'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: simtest/go.mod
          cache-dependency-path: simtest/go.sum
      # TestMutantsCaught, in the step below, runs each planted bug in a child built with the
      # tag tenure_mutants.
      - name: vet with the planted bugs (tenure_mutants)
        run: go -C simtest vet -tags tenure_mutants ./...
      - name: simulations with the short seed counts
        env:
          FAULTLINE_ARTIFACTS: ${{ runner.temp }}/faultline
        run: go -C simtest test -race -short -count=1 ./...
      - name: upload the artifacts of the failing seeds
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: faultline-short
          path: ${{ runner.temp }}/faultline

  simtest:
    name: simtest (full seed counts)
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GOWORK: 'off'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: simtest/go.mod
          cache-dependency-path: simtest/go.sum
      - name: simulations with the full seed counts
        env:
          FAULTLINE_ARTIFACTS: ${{ runner.temp }}/faultline
        run: go -C simtest test -count=1 -timeout 55m ./...
      - name: upload the artifacts of the failing seeds
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: faultline-full
          path: ${{ runner.temp }}/faultline

  k8s:
    name: k8s on kind
    runs-on: ubuntu-latest
    env:
      GOWORK: 'off'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: k8s/go.mod
          cache-dependency-path: k8s/go.sum
      - name: install kind
        run: go install sigs.k8s.io/kind@v0.33.0
      - name: create the kind cluster
        run: kind create cluster --name tenure --image kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5 --kubeconfig "$RUNNER_TEMP/kubeconfig" --wait 120s
      - name: test the k8s module on kind
        env:
          TENURE_TEST_EXTERNAL: '1'
        run: |
          set -o pipefail
          TENURE_TEST_KUBECONFIG="$RUNNER_TEMP/kubeconfig" go -C k8s test -race -count=1 -v ./... 2>&1 | tee "$RUNNER_TEMP/k8s-test.log"
      - name: no k8s test skipped
        # The only skips allowed are the storetest cases that need Advance or SetWall, which a
        # real cluster cannot offer, and, until Phase 2, membershiptest's Propagation/Estimate.
        # go test -v names the test before each line it logs, so a skip message belongs to the
        # last test named.
        run: |
          awk '
            /^ *=== (RUN|NAME|CONT|PAUSE) / { current = $3 }
            /: storetest: fixture has no (Advance|SetWall)$/ { allowed[current] = 1 }
            /: membershiptest: membership does not implement tenure\.PropagationEstimator$/ { allowed[current] = 1 }
            /^ *--- SKIP: / && !allowed[$3] { print "unexpected skip: " $0; bad = 1 }
            END { exit bad }
          ' "$RUNNER_TEMP/k8s-test.log"

  examples-k8s:
    name: examples on kind
    runs-on: ubuntu-latest
    env:
      GOWORK: 'off'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: examples/go.mod
          cache-dependency-path: examples/go.sum
      - name: install kind
        run: go install sigs.k8s.io/kind@v0.33.0
      - name: build the images
        run: |
          docker build -f examples/signer/k8s/Dockerfile --build-arg PKG=./signer/k8s -t tenure-signer:dev .
          docker build -f examples/signer/k8s/Dockerfile --build-arg PKG=./signer/noncesvc -t tenure-noncesvc:dev .
      - name: create the kind cluster
        run: |
          echo "KUBECONFIG=$RUNNER_TEMP/kubeconfig" >> "$GITHUB_ENV"
          kind create cluster --name tenure-examples --image kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5 --kubeconfig "$RUNNER_TEMP/kubeconfig" --wait 120s
      - name: deploy the signer and noncesvc
        run: |
          kind load docker-image tenure-signer:dev tenure-noncesvc:dev --name tenure-examples
          kubectl apply -k examples/signer/k8s/deploy
          kubectl -n tenure-signer rollout status deploy/noncesvc deploy/signer --timeout 120s
      - name: test the signer through a rollout
        env:
          TENURE_TEST_EXTERNAL: '1'
        run: |
          set -o pipefail
          TENURE_TEST_KUBECONFIG="$KUBECONFIG" go -C examples test -race -count=1 -v -run '^TestSignerKubernetes$' ./signer/k8s 2>&1 | tee "$RUNNER_TEMP/examples-k8s-test.log"
      - name: TestSignerKubernetes not skipped
        run: |
          grep -q -e '^--- PASS: TestSignerKubernetes ' "$RUNNER_TEMP/examples-k8s-test.log"
          if grep -e '--- SKIP: TestSignerKubernetes' "$RUNNER_TEMP/examples-k8s-test.log"; then exit 1; fi
      - name: cluster state after a failure
        if: failure()
        run: |
          kubectl get pods,leases -A -o wide || true
          kubectl -n tenure-signer describe pods || true
          kubectl -n tenure-signer logs -l app=signer --all-containers --tail=200 --prefix || true
          kubectl -n tenure-signer logs -l app=noncesvc --all-containers --tail=200 --prefix || true

  golden-trailer:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: golden changes need an explanation
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          base="$BASE_SHA"
          if git diff --name-only "$base"...HEAD | grep -qx -e 'internal/dettest/testdata/core-digests.txt' -e 'simtest/testdata/hashes.txt'; then
            if ! git log --format=%B "$base"..HEAD | grep -Eq '^Golden-Update: .+'; then
              echo "a golden file changed: add a 'Golden-Update: <reason>' line to a commit message"
              exit 1
            fi
          fi

  commits:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Conventional Commits, no AI attribution
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          base="$BASE_SHA"
          bad=0
          for c in $(git rev-list --no-merges "$base"..HEAD); do
            subject=$(git log -1 --format=%s "$c")
            if ! printf '%s\n' "$subject" | grep -Eq '^(feat|fix|docs|test|refactor|perf|build|ci|chore|revert)(\([a-z0-9./_-]+\))?!?: .+'; then
              echo "$c: subject is not a Conventional Commit: $subject"
              bad=1
            fi
            if git log -1 --format=%B "$c" | grep -Eiq '^co-authored-by:|^[^[:alnum:]]*generated (with|by) '; then
              echo "$c: commit message carries an attribution line"
              bad=1
            fi
          done
          exit $bad
